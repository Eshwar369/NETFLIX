<!DOCTYPE html>
<html>
    <head>
        <link rel="Stylesheet" href="styles.css">
        <title> NETFLIX</title>
    </head>
    <body>
        <h1 class="text">NETFLIX</h1>
        <p> number of people clicked the <button id="butti">BUTTON</button></p>
        <div class="display" id="display">
            1
        </div>
        <script>
            let count=1;

            const butt=document.getElementById("butti");
            const disp=document.getElementById("display")

            
            butt.addEventListener("click",incre)

            function incre(){
                disp.innerText=(disp.innerText) *2;
            }
        </script>
    </body>
</html>
